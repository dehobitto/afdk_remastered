# Builds the DLLs on every push; a tag vX.Y publishes a release with the ready-to-run zip.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      LLVM_MINGW: '20261020'
      VT_API_KEY: ${{ secrets.VIRUSTOTAL }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (llvm-mingw)
        shell: pwsh
        run: |
          $v = $env:LLVM_MINGW
          curl.exe -fsSL -o llvm.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-msvcrt-x86_64.zip"
          Expand-Archive llvm.zip -DestinationPath C:\tools
          "AFDK_CLANG=C:\tools\llvm-mingw-$v-msvcrt-x86_64\bin\i686-w64-mingw32-clang.exe" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: ./patch/build.ps1

      - name: Package
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION $ver"
          }
          $pkg = "AFDK_Remastered_$ver"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item patch/dist/AFDK.exe, patch/dist/_afdk_remastered.dll, patch/dist/_afdk_remastered_mcp.dll, patch/dist/afdk_mcp.py, README.md $pkg
          Compress-Archive "$pkg/*" "$pkg.zip"           # files at the zip root: unpack straight into the AFDK folder
          "PKG=$pkg" >> $env:GITHUB_ENV
          "VER=$ver" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip

      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "$env:PKG.zip" --title "AFDK Remastered $env:VER" --generate-notes

      # the files in the published zip (not the zip itself, not the README) go to VirusTotal; their report links are
      # added to the release notes
      # (a manual run of the workflow refreshes them for the release of the current VERSION)
      - name: VirusTotal
        if: env.VT_API_KEY != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VER"
          New-Item -ItemType Directory vt | Out-Null
          gh release download $tag -p "*.zip" -D vt
          if ($LASTEXITCODE) { Write-Warning "no release $tag"; exit 0 }
          $zip = Get-ChildItem vt -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName vt/files
          $files = @(Get-ChildItem vt/files -File | Where-Object Name -ne 'README.md')
          $links = @()
          foreach ($f in $files) {
            $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $code = curl.exe -s -o vt/answer.json -w "%{http_code}" -X POST https://www.virustotal.com/api/v3/files `
              -H "x-apikey: $env:VT_API_KEY" -F "file=@$($f.FullName)"
            if ($code -ne '200') { Write-Warning "VirusTotal upload of $($f.Name): HTTP $code $(Get-Content vt/answer.json -Raw)" }
            $links += "- [$($f.Name)](https://www.virustotal.com/gui/file/$sha)"
            Start-Sleep -Seconds 16                                   # free API: 4 requests a minute
          }
          $body = (gh release view $tag --json body -q .body) -join "`n"
          $body = ($body -split "`n## VirusTotal")[0].TrimEnd()
          $note = "A few heuristic engines may flag the files: AFDK.exe is patched to load the DLL (an added import, " +
                  "like file infectors do) and the DLL hooks system functions. These are false positives."
          $body += "`n`n## VirusTotal`n`n$note`n`n" + ($links -join "`n") + "`n"
          Set-Content vt/notes.md $body -Encoding utf8
          gh release edit $tag --notes-file vt/notes.md
